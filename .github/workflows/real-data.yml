name: Real sequential validation

on:
  push:
    branches: [agent/submission-ready-v2]
  pull_request:
    paths:
      - experiments/real_sequential.py
      - experiments/test_real_sequential.py
      - requirements.txt
      - .github/workflows/real-data.yml

permissions:
  contents: read

jobs:
  appliances:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run real sequential experiment
        run: PYTHONPATH=experiments python experiments/real_sequential.py
      - uses: actions/upload-artifact@v4
        with:
          name: real-sequential-results
          path: results/real_sequential
          if-no-files-found: error
          retention-days: 7
