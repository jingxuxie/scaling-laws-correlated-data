name: Diagnose research patch

on:
  push:
    branches: [agent/submission-ready-v2]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/submission-ready-v2
          fetch-depth: 0
      - name: Diagnose packaged patch
        run: |
          set +e
          cat .research_patch.part* > /tmp/combined.b64
          {
            echo 'PART SIZES'
            wc -c .research_patch.part*
            echo 'COMBINED SIZE'
            wc -c /tmp/combined.b64
            echo 'DECODE'
            base64 -d /tmp/combined.b64 > /tmp/submission-patch.tar.gz
            echo "decode_status=$?"
            ls -l /tmp/submission-patch.tar.gz
            sha256sum /tmp/submission-patch.tar.gz
            echo 'GZIP TEST'
            gzip -t /tmp/submission-patch.tar.gz
            echo "gzip_status=$?"
            echo 'TAR LIST'
            tar -tzf /tmp/submission-patch.tar.gz | head -40
            echo "tar_status=${PIPESTATUS[0]}"
          } > patch-diagnostic.txt 2>&1
          git config user.name "OpenAI Research Agent"
          git config user.email "research-agent@openai.com"
          git add patch-diagnostic.txt
          git commit -m "Diagnose packaged research patch"
          git push origin HEAD:agent/submission-ready-v2
