name: CI

on:
  push:
    paths-ignore:
      - "paper/*.pdf"
      - "paper/figures/*.pdf"
      - "results/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: make test
      - name: Run exact-risk smoke test
        run: >-
          PYTHONPATH=experiments python experiments/exact_risk.py
          --model-size 4096 --max-power 14 --fit-points 5
          --output-dir /tmp/exact-pilot
      - name: Run dense-representation smoke test
        run: >-
          PYTHONPATH=experiments python experiments/dense_features.py
          --model-size 48 --block-powers 3 4 5 --trials 3 --fit-points 2
          --output-dir /tmp/dense-features
      - name: Run dense-AR smoke test
        run: >-
          PYTHONPATH=experiments python experiments/dense_ar_control.py
          --dimension 24 --n-values 6 10 16 --trials 3 --fit-points 2
          --output-dir /tmp/dense-ar
      - name: Run matched-ESS and compute smoke test
        run: >-
          PYTHONPATH=experiments python experiments/matched_ess_compute.py
          --model-size 2048 --horizon-powers 7 8 9 10 --trials 12
          --raw-fit-points 2 --compute-powers 9 10 11 12 13
          --compute-max-model-size 256 --compute-grid-size 40
          --compute-fit-points 3 --output-dir /tmp/matched-ess-compute
